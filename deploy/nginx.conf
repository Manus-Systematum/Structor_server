# structor.systematum.net — static file server.
# Serves one page and its assets. No upstreams, no scripting, no uploads.

worker_processes  1;
error_log  /dev/stderr  warn;
pid        /tmp/nginx.pid;

events {
    worker_connections  256;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log  /dev/stdout  combined;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    # Nothing is ever uploaded to this host, and the page has no form —
    # support goes through the apex site.
    client_max_body_size  1k;
    client_body_timeout   10s;
    client_header_timeout 10s;
    keepalive_timeout     30s;

    # Read-only root filesystem: every scratch path lives in the tmpfs.
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    gzip              on;
    gzip_min_length   512;
    gzip_types        text/css image/svg+xml application/json;
    # PNG, ICO and the .json.gz bundles are already compressed; gzip would
    # only cost CPU. The bundles must also never be sent with a
    # `Content-Encoding: gzip` header — the app gunzips the body itself, and a
    # client that had already done so would hand it plain JSON to inflate.

    # Cache policy by type, set here rather than in a nested location, because
    # an add_header inside a location would discard the security headers below.
    # The dataset is content-named (§3.19): every published file carries a
    # hash of its own bytes, so a file that changed is a URL nothing has
    # cached and a file that did not is one every cache may keep for good.
    # The manifest is the exception — it is the entry point, its name is
    # fixed, and it is the file that must be re-read to learn the others.
    map $uri $data_cache {
        default             "public, max-age=31536000, immutable";
        /data/manifest.json "no-cache";
    }

    map $sent_http_content_type $cache_ttl {
        default                    5m;
        ~^text/html                5m;
        ~^text/css                 1h;
        ~^application/javascript   1h;
        ~^image/                    7d;
    }

    server {
        listen      8080;
        # The only server block, so it is the default anyway.
        server_name structor.systematum.net;

        root  /usr/share/nginx/html;
        index index.html;
        autoindex off;

        expires $cache_ttl;

        add_header X-Content-Type-Options   "nosniff"            always;
        add_header X-Frame-Options          "DENY"               always;
        add_header Referrer-Policy          "no-referrer"        always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Permissions-Policy       "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

        # The page loads no third-party anything and runs no script of its
        # own, so the policy closes completely: script-src and connect-src are
        # 'none' rather than 'self'. Adding any JavaScript means changing this
        # line, which is the intended friction.
        add_header Content-Security-Policy  "default-src 'none'; style-src 'self'; script-src 'none'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

        # The dataset the app fetches (§3.4): the manifest, the faction
        # bundles, the correction patch and the layout pictures. The app ships
        # everything but the pictures in its binary, so this path is what makes
        # a data update reach an installed app without an App Store release.
        location /data/ {
            # Content-named files can be cached forever, which is the point of
            # naming them that way: Cloudflare holds `.json.gz` and `.png` at
            # the edge whatever this says, and now that is what we want rather
            # than something to be endured.
            #
            # Superseded (2026-08-28): this path used to send `no-cache` for
            # everything, because a stale bundle would fail the app's hash
            # check and leave it silently on the copy in its binary — safe,
            # but an update could take the edge's four hours to arrive. The
            # names carry the hash now, so a stale URL cannot exist; only the
            # manifest revalidates, and it is the only file whose name stays
            # put.
            expires off;
            add_header Cache-Control $data_cache always;

            # Public data, and a web build of the app would be a different
            # origin from this host.
            add_header Access-Control-Allow-Origin "*" always;

            # The security headers on the server block are not inherited once
            # a location adds one of its own.
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy        "no-referrer" always;

            autoindex off;
            try_files $uri =404;
        }

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
